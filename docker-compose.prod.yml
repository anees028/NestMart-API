version: '3.8'

services:
  app:
    build: . # Build the Dockerfile we just made
    ports:
      - "80:3000" # Map Server Port 80 (HTTP) to Container Port 3000
    environment:
      - DB_HOST=db
      - DB_PORT=${DB_PORT}              # ✅ From .env
      - DB_USERNAME=${DB_USERNAME}      # ✅ From .env
      - DB_PASSWORD=${DB_PASSWORD}      # ✅ From .env
      - DB_NAME=${DB_NAME}              # ✅ From .env
      - JWT_SECRET=${JWT_SECRET}        # ✅ From .env
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}     # ✅ From .env
      POSTGRES_PASSWORD: ${DB_PASSWORD} # ✅ From .env
      POSTGRES_DB: ${DB_NAME}           # ✅ From .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: